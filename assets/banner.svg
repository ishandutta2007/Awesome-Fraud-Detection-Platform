<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(.98)}50%{opacity:.8;transform:scale(1.02)}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.pulse-bg{animation:pulse 6s infinite ease-in-out;transform-origin:center}.pulse-line{stroke-dasharray:10,10;animation:dash 5s linear infinite}.node-float1{animation:floatNode 4s infinite ease-in-out}.node-float2{animation:floatNode 5s infinite ease-in-out 1s}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="12"/><rect width="1200" height="300" fill="url(#grid)" rx="12"/><g class="pulse-bg" opacity=".4"><circle cx="1050" cy="80" r="180" fill="#6366f1" filter="url(#glow)" opacity=".15"/><circle cx="150" cy="220" r="140" fill="#ec4899" filter="url(#glow)" opacity=".1"/></g><g opacity=".25"><path fill="none" stroke="url(#accentGrad)" stroke-width="4" d="M 0 150 Q 100 50, 200 120 T 400 80 T 550 40" transform="translate(650, 60)"/><path fill="url(#accentGrad)" d="M 0 150 Q 100 50, 200 120 T 400 80 T 550 40 L 550 200 L 0 200 Z" opacity=".1" transform="translate(650, 60)"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 0 110 Q 120 180, 220 90 T 420 130 T 550 90" class="pulse-line" transform="translate(650, 60)"/></g><g opacity=".35" transform="translate(700, 40)"><line x1="100" x2="220" y1="80" y2="140" stroke="#6366f1" stroke-width="1.5"/><line x1="220" x2="340" y1="140" y2="60" stroke="#a855f7" stroke-width="1.5"/><line x1="340" x2="420" y1="60" y2="150" stroke="#ec4899" stroke-width="1.5"/><g class="node-float1"><circle cx="100" cy="80" r="6" fill="#6366f1"/><circle cx="100" cy="80" r="12" fill="none" stroke="#6366f1" stroke-width="1.5" opacity=".5"/></g><g class="node-float2"><circle cx="220" cy="140" r="8" fill="#a855f7"/><circle cx="340" cy="60" r="7" fill="#ec4899"/></g></g><rect width="1200" height="5" x="0" y="0" fill="url(#accentGrad)"/><g><g transform="translate(60, 0) translate(0, 50)"><rect width="280" height="30" fill="#1e293b" stroke="#334155" stroke-width="1" rx="15"/><circle cx="15" cy="15" r="4" fill="#10b981"/><text x="28" y="20" class="badge-text">🛡️ REAL-TIME RISK &amp; FRAUD ECOSYSTEM</text></g><text x="0" y="130" class="title" transform="translate(60, 0)">Awesome Fraud Detection Platform</text><text x="0" y="170" class="subtitle" transform="translate(60, 0)">Curated SaaS Platforms, Enterprise Engines &amp; Open-Source Risk Intelligence</text><g transform="translate(60, 0) translate(0, 205)"><rect width="150" height="32" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="15" y="21" fill="#cbd5e1" font-family="system-ui" font-size="13" font-weight="500">💳 Payment Fraud</text><rect width="165" height="32" x="162" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="177" y="21" fill="#cbd5e1" font-family="system-ui" font-size="13" fo