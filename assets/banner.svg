<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Subtle Dynamic Animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatNode {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .pulse-bg { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .pulse-line { stroke-dasharray: 10, 10; animation: dash 5s linear infinite; }
    .node-float1 { animation: floatNode 4s infinite ease-in-out; }
    .node-float2 { animation: floatNode 5s infinite ease-in-out 1s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="12" />
  <rect width="1200" height="300" fill="url(#grid)" rx="12" />

  <!-- DYNAMIC / BACKGROUND GRAPHICS (Layered strictly BEHIND text) -->
  <g class="pulse-bg" opacity="0.4">
    <circle cx="1050" cy="80" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
    <circle cx="150" cy="220" r="140" fill="#ec4899" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Animated Wave Graph in Background (Right Side) -->
  <g opacity="0.25" transform="translate(650, 60)">
    <path d="M 0 150 Q 100 50, 200 120 T 400 80 T 550 40" fill="none" stroke="url(#accentGrad)" stroke-width="4" />
    <path d="M 0 150 Q 100 50, 200 120 T 400 80 T 550 40 L 550 200 L 0 200 Z" fill="url(#accentGrad)" opacity="0.1" />
    <path class="pulse-line" d="M 0 110 Q 120 180, 220 90 T 420 130 T 550 90" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Network Nodes & Connecting Flow Lines (Background Right) -->
  <g opacity="0.35" transform="translate(700, 40)">
    <line x1="100" y1="80" x2="220" y2="140" stroke="#6366f1" stroke-width="1.5" />
    <line x1="220" y1="140" x2="340" y2="60" stroke="#a855f7" stroke-width="1.5" />
    <line x1="340" y1="60" x2="420" y2="150" stroke="#ec4899" stroke-width="1.5" />
    
    <g class="node-float1">
      <circle cx="100" cy="80" r="6" fill="#6366f1" />
      <circle cx="100" cy="80" r="12" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5" />
    </g>
    <g class="node-float2">
      <circle cx="220" cy="140" r="8" fill="#a855f7" />
      <circle cx="340" cy="60" r="7" fill="#ec4899" />
    </g>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)" />

  <!-- FOREGROUND CONTENT (Guaranteed Unobscured Title & Subtitle) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#10b981" />
      <text x="28" y="20" class="badge-text">🛡️ REAL-TIME RISK &amp; FRAUD ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Fraud Detection Platform</text>
    
    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle">Curated SaaS Platforms, Enterprise Engines &amp; Open-Source Risk Intelligence</text>

    <!-- Feature Highlights / Tags -->
    <g transform="translate(0, 205)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="150" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="15" y="21" fill="#cbd5e1" font-family="system-ui" font-size="13" font-weight="500">💳 Payment Fraud</text>

      <!-- Tag 2 -->
      <rect x="162" y="0" width="165" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="177" y="21" fill="#cbd5e1" font-family="system-ui" font-size="13" font-weight="500">👤 Account Abuse</text>

      <!-- Tag 3 -->
      <rect x="339" y="0" width="170" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="354" y="21" fill="#cbd5e1" font-family="system-ui" font-size="13" font-weight="500">⚡ Real-Time Decisioning</text>

      <!-- Tag 4 -->
      <rect x="521" y="0" width="140" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="536" y="21" fill="#cbd5e1" font-family="system-ui" font-size="13" font-weight="500">🕸️ Graph Analytics</text>
    </g>
  </g>
</svg>
